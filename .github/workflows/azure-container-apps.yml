name: Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      container_app_name:
        description: "Azure Container App name"
        required: true
        default: "deepline-gtm-agent"
      resource_group:
        description: "Azure resource group"
        required: true
      acr_name:
        description: "Azure Container Registry name without .azurecr.io"
        required: true
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "server.py"
      - "pyproject.toml"
      - "deepline_gtm_agent/**"
      - "managed_agent/**"
      - ".github/workflows/azure-container-apps.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: ${{ github.event.inputs.acr_name || vars.AZURE_ACR_NAME }}
          containerAppName: ${{ github.event.inputs.container_app_name || vars.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ github.event.inputs.resource_group || vars.AZURE_RESOURCE_GROUP }}
          environmentVariables: >-
            PORT=8000
            DEEPLINE_API_KEY=secretref:deepline-api-key
            API_KEY=secretref:api-key
            CORS_ORIGINS=${{ vars.CORS_ORIGINS }}
            SLACK_ALLOWED_CHANNEL_IDS=${{ vars.SLACK_ALLOWED_CHANNEL_IDS }}
            SLACK_ALLOWED_USER_IDS=${{ vars.SLACK_ALLOWED_USER_IDS }}
            SLACK_BOT_TOKEN=secretref:slack-bot-token
            SLACK_SIGNING_SECRET=secretref:slack-signing-secret
            REDIS_URL=secretref:redis-url
